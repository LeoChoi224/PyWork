<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <title>FashionMNIST</title>
</head>
<body>
    <div class="container">
    <h2>FashionMNIST 이미지 분류</h2>
    <input class="btn btn-outline-primary" type="file" id="imageInput" accept="image/*">
    <button class="btn btn-success" onclick="uploadImage()">업로드</button>

    <div id="imageContainer" style="margin-top: 20px;">
        <p>업로드된 이미지: <span class="badge bg-success" id="predClass"></span></p>
        <img id="preview" src="" alt="미리보기" style="max-width: 300px; display: none;">
    </div>

    <script>
        async function uploadImage(){
            const input = document.getElementById("imageInput");
            if(input.files.length == 0) {
                alert("이미지를 선택하세요!");
                return;
            }

            // multipart/formdata
            const formData = new FormData()
            formData.append("fashionfile", input.files[0]);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                if (response.ok) {
                    // 서버에서 보낸 url을 <img> 태그의 src에 넣기
                    const imgElement = document.getElementById('preview');
                    imgElement.src = result.url;
                    imgElement.style.display = 'block';

                    // 서버에서 보낸 예측값
                    const predElement = document.getElementById('presClass');
                    predElement.innerHTML = result.pred;

                } else {
                    alert("업ㄹ로드 실패!");
                }
            } catch (error) {
                console.error("에러 발생:", error);
            }
        }

    </script>

    </div>
</body>
</html>
