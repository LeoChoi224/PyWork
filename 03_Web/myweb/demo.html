<!-- 웹페이지 뼈대 및 UI 컨테이너 -->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤형 콘텐츠 추천</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Markdown 을 HTML 로 변환 -->
    <script src="https://kit.fontawesome.com/51772bd9bd.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <header>
        <h1>🎬 AI 무비 큐레이터</h1>
        <!-- <button id="nav-mypage-btn">내 찜 목록</button> -->
    </header>

    <main id="app">
        <!-- 1. 메인 페이지 -->
        <section id="page-main" class="view active">
            <h2>당신만을 위한 완벽한 영화를 찾아드립니다</h2>
            <button id="start-btn">시작하기</button>
        </section>

        <!-- 2. 정보 입력 페이지 -->
        <section id="page-input" class="view hidden">
            <h2>당신의 취향과 기분을 알려주세요</h2>
            <form id="infoForm">
                <select id="gender">
                    <option value="male">남성</option>
                    <option value="female">여성</option>
                </select>
                <input type="number" id="age" placeholder="나이">
                <input type="text" id="mbti" placeholder="MBTI (예: ISTP)">
                <textarea id="mood" placeholder="오늘 기분이나 요청사항을 입력하세요. (예: 우울해서 펑펑 울고 싶어, 배꼽 빠지게 웃긴 영화 추천해줘)"></textarea>
                <!-- <button type="submit">AI에게 추천받기</button> -->
                <button type="button" id="recommend-btn">추천받기</button>
            </form>
        </section>

        
        <!-- 3. 로딩 페이지 (API 통신 중) -->
        <section id="page-loading" class="view hidden">
            <h2>AI가 데이터를 분석 중입니다... ⏳</h2>
            <div id="analysis-output"></div>
        </section>
        
        <!-- 4. 추천 결과 페이지 -->
        <section id="page-result" class="view hidden">
            <h2>✨ AI의 추천 결과 ✨</h2>
            <div id="movie-output"></div>
            <div id="test-output"></div>
            <div id="result-container">
                <!-- 자바스크립트로 영화 카드들이 여기에 생성됩니다 -->
            </div>
            <button id="restart-btn">다시 추천받기</button>
        </section>

        <!-- 5. 영화 상세 페이지 -->
        <section id="page-detail" class="view hidden">
            <button id="back-to-result-btn">⬅️ 뒤로가기</button>
            <div id="detail-container">
                <!-- 영화 상세 정보가 여기에 생성됩니다 -->
            </div>
            <!-- <button id="save-movie-btn">❤️ 찜하기</button> -->
        </section>

        <!-- 6. 마이페이지 (찜 목록) -->
        <!-- <section id="page-mypage" class="view hidden">
            <h2>❤️ 내 찜 목록</h2>
            <div id="mypage-container"> -->
        <!-- 로컬스토리지에 저장된 영화들이 여기에 생성됩니다 -->
        <!-- </div>
            <button id="back-to-main-btn">메인으로</button>
        </section> -->
    </main>

    <script src="js/config/config.js"></script>

    <script src="js/constants/genres.js"></script>

    <script src="js/prompts/prompts.js"></script>

    <script src="js/utils/validator.js"></script>
    <script src="js/utils/formatter.js"></script>
    <script src="js/utils/mapper.js"></script>
    <script src="js/utils/image.util.js"></script>
    <script src="js/utils/storage.js"></script>

    <script src="js/ui/ui.js"></script>

    <script src="js/api/gemini.api.js"></script>
    <script src="js/api/openai.api.js"></script>
    <script src="js/api/tmdb.api.js"></script>

    <script src="js/services/recommendation.service.js"></script>
    
    <script src="js/app.js"></script>
</body>

</html>
