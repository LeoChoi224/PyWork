<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Type</title>
</head>
<!--
    https://www.chartjs.org/docs/latest/charts/bar.html
    https://github.com/chartjs/Chart.js/blob/master/docs/charts/bar.md
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body>
    <h2>Horizontal Bar Chart</h2>
    <div>        
        <canvas id="BarChart1"></canvas>
    </div>
</body>
<script>
const barChart1 = document.getElementById('BarChart1');
const barChart2 = document.getElementById('BarChart2');

const labels = ['1월','2월','3월','4월','5월','6월','7월'];
const data = {
    labels: labels,
    datasets: [{
        label: '월매출',
        data: [65, 59, 80, 81, 56, 55, 40],
        backgroundColor: [
            'rgba(255, 99, 132, 0.2)',
            'rgba(255, 159, 64, 0.2)',
            'rgba(255, 205, 86, 0.2)',
            'rgba(75, 192, 192, 0.2)',
            'rgba(54, 162, 235, 0.2)',
            'rgba(153, 102, 255, 0.2)',
            'rgba(201, 203, 207, 0.2)'
        ],
        borderColor: [
                'rgb(255, 99, 132)',
                'rgb(255, 159, 64)',
                'rgb(255, 205, 86)',
                'rgb(75, 192, 192)',
                'rgb(54, 162, 235)',
                'rgb(153, 102, 255)',
                'rgb(201, 203, 207)'
            ],
        borderWidth: 1
        }]
    };


const config = {
    type: 'bar',
    data: data,
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    },
};

new Chart(barChart1, config);
new Chart(barChart2, config);
</script>


</html>
