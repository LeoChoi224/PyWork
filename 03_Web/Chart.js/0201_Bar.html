<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>
    <h2>Bar Chart</h2>
    <div>
        <!-- Chart 가 그려질 canvas -->
        <canvas id="myChart"></canvas>
    </div>


</body>
<script>
    // Chart 가 그려질 element
    const ctx = document.getElementById('myChart');

    // new Chart(ctx, config);
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [
                {
                    label: '# of Votes',
                    data: [12, 19, 3, 5, 2, 3],
                    borderWidth: 1,
                },
            ],
        },
    });

    /*
       기본적인 config object 구조   https://www.chartjs.org/docs/latest/configuration/
    
       const config = {
            type: 'line'
            data: {}    // data structure  → https://www.chartjs.org/docs/latest/general/data-structures.html
            options: {}
            plugins: []
        }
    */
</script>
